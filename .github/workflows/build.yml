name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQViewerPin
          path: QQViewerPin.exe
